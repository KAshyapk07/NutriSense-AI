<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NutriVerse — Options</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; background: #f6f6f6; color: #111; padding: 32px; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input { width: 480px; max-width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
    input:focus { border-color: #aaa; }
    button { margin-top: 12px; padding: 8px 20px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; color: #3c8; }
  </style>
</head>
<body>
  <h1>NutriVerse — Developer Options</h1>
  <label for="api-url">Backend URL</label>
  <input type="url" id="api-url" placeholder="https://…" />
  <br />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
