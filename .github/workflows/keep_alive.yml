name: Keep Neo4j Alive

on:
  schedule:
    # Runs every 2 days at 00:00 UTC. Neo4j Aura Free pauses after 3 days of
    # inactivity, so every 2 days gives a safe margin.
    - cron: '0 0 */2 * *'
  workflow_dispatch: # This line adds a button in GitHub so you can trigger it manually to test!

jobs:
  ping-database:
    runs-on: ubuntu-latest
    environment: .Nutri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j

      - name: Ping Neo4j Database
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python ping_db.py