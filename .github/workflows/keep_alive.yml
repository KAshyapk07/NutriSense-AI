name: Keep Neo4j Alive

on:
  schedule:
    # Runs at 00:00 every Sunday. You can change this cron schedule if needed.
    - cron: '0 0 * * 0' 
  workflow_dispatch: # This line adds a button in GitHub so you can trigger it manually to test!

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j

      - name: Ping Neo4j Database
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python ping_db.py