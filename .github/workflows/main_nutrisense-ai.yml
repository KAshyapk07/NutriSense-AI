name: CI-CD Pipeline 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. LINT ─────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check Backend/
        run: ruff check Backend/

      - name: Check Src/
        run: ruff check Src/

  # ── 2. TEST ─────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  # ── 3. BUILD & PUSH DOCKER ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io/
          username: pes2ug23cs263kashyapk
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_59CF857C1B274AF09D395B60F0E8AB3C }}

      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: docker.io/pes2ug23cs263kashyapk/nutrisense-ai:${{ github.sha }}
          file: ./Dockerfile

  # ── 4. DEPLOY ───────────────────────────────────────────
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A99A1776FD634223BE397F4E346DC0BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_72EDA955F18B4F09A0F4C8A9E33268AA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A08CF423959245AEB11B997DE7C9001E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'NutriSense-AI'
          slot-name: 'Production'
          images: docker.io/pes2ug23cs263kashyapk/nutrisense-ai:${{ github.sha }}
